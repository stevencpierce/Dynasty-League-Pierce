<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Space+Grotesk:wght@500&family=Syne:wght@600&family=Inter:wght@500&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background:#000; color:#f5f5f7; font-family:Inter,sans-serif; }
  .row { padding: 52px 64px; border-bottom:1px solid rgba(255,255,255,.1); }
  .tag { font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#79a7f2; font-weight:500; margin-bottom:18px; }
  .big { font-size:84px; line-height:.98; letter-spacing:-.02em; font-weight:500; }
  .a { color:#79a7f2; }
  .bricolage .big { font-family:'Bricolage Grotesque',sans-serif; }
  .space .big    { font-family:'Space Grotesk',sans-serif; }
  .syne .big     { font-family:'Syne',sans-serif; }
</style>
</head>
<body>
  <div class="row bricolage">
    <p class="tag">Option A — Bricolage Grotesque (current)</p>
    <div class="big">Prepare. Produce. <span class="a">Amplify.</span></div>
  </div>
  <div class="row space">
    <p class="tag">Option B — Space Grotesk (diagonal / techy)</p>
    <div class="big">Prepare. Produce. <span class="a">Amplify.</span></div>
  </div>
  <div class="row syne">
    <p class="tag">Option C — Syne (unique / artistic)</p>
    <div class="big">Prepare. Produce. <span class="a">Amplify.</span></div>
  </div>
</body>
</html>
